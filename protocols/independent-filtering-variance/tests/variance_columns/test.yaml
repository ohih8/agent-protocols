name: variance_columns
description: Diagnostic unbiased variance case with features in columns, testing correction or refusal.
inputs:
  data: {path: input.csv}
  filter: variance
  theta: 0.4
  feature_orientation: columns
  tie_breaker: feature_id_ascending
evaluation:
  mode: diagnostic
  numeric_tolerance: 1.0e-12
  accepted_outcomes:
  - outcome: orientation_corrected
    expected_outputs:
      summary: {A: 0, B: 1.3333333333333333, C: 1.3333333333333333, D: 33.333333333333336, E: 48}
      removed_features: [A, B]
      retained_features: [C, D, E]
  - outcome: refused_for_orientation
    expected_absent: [summary, removed_features, retained_features, retained_matrix]
