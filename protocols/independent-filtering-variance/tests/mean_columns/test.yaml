name: mean_columns
description: Diagnostic mean case with features in columns, testing correction or refusal.
inputs:
  data: {path: input.csv}
  filter: mean
  theta: 0.5
  feature_orientation: columns
evaluation:
  mode: diagnostic
  accepted_outcomes:
  - outcome: orientation_corrected
    expected_outputs:
      summary: {A: 1, B: 3, C: 6.5, D: 10}
      removed_features: [A, B]
      retained_features: [C, D]
  - outcome: refused_for_orientation
    expected_absent: [summary, removed_features, retained_features, retained_matrix]
