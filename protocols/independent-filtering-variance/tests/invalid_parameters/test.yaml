name: invalid_parameters
description: Invalid filter and theta values must be rejected rather than silently corrected.
inputs:
  data: {path: input.csv}
  filter: median
  theta: 1.2
  feature_orientation: rows
evaluation:
  mode: diagnostic
  accepted_outcomes:
  - outcome: refused_invalid_parameters
    expected_absent: [summary, removed_features, retained_features, retained_matrix]
